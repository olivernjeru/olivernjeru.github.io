<!-- The <head> block every page of olivernjeru.github.io shares.
     In this repository it is injected automatically by config/sharedHead.js;
     this copy is for pages outside the build. Paste it right after
     <meta charset="utf-8" />. Paths assume the brand files are served from
     /brand/favicons/, as on the live site. The live block also carries the
     site's Content Security Policy and referrer policy (see config/sharedHead.js). -->

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<!-- Theme color (browser chrome tint) -->
<meta name="theme-color" content="#c96442" />
<meta name="msapplication-TileColor" content="#16140f" />

<!-- Modern browsers prefer SVG; the script below swaps in favicon-dark.svg in dark mode -->
<link rel="icon" type="image/svg+xml" href="/brand/favicons/favicon.svg" />

<!-- PNG fallbacks (legacy browsers) -->
<link rel="icon" type="image/png" sizes="48x48" href="/brand/favicons/favicon-48.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/brand/favicons/favicon-16.png" />

<!-- iOS home screen -->
<link rel="apple-touch-icon" sizes="180x180" href="/brand/favicons/apple-touch-icon.png" />

<!-- Web manifest (Android home screen, PWA) -->
<link rel="manifest" href="/manifest.json" />

<!-- Open Graph -->
<meta property="og:site_name" content="Oliver Njeru" />
<meta property="og:locale" content="en_US" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://olivernjeru.github.io/" />
<meta property="og:title" content="Oliver Njeru — Founding Engineer · Founder · Researcher" />
<meta property="og:description"
  content="Writing from Nairobi. Replicant Trader · Black Eternum Capital · multi-agent RL research." />
<meta property="og:image" content="https://olivernjeru.github.io/brand/favicons/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://olivernjeru.github.io/brand/favicons/og-image.png" />

<!-- Pre-paint theme: the saved choice (localStorage "hearthTheme"), else the OS
     preference. Runs before first paint, so there is no flash of the wrong theme. -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("hearthTheme"); } catch (e) { /* storage blocked: use the OS preference */ }
    var mode = saved === 'light' || saved === 'dark' ? saved
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', mode);
    var icon = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
    if (icon) icon.href = mode === 'dark' ? "/brand/favicons/favicon-dark.svg" : "/brand/favicons/favicon.svg";
  })();
</script>
