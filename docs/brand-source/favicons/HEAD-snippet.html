<!-- Paste into the <head> of every page.
     Adjust /favicons/ prefix to match your deploy path. -->

<!-- Modern browsers prefer SVG -->
<link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />

<!-- PNG fallbacks (legacy browsers, dark-mode tabs) -->
<link rel="icon" type="image/png" sizes="48x48" href="/favicons/favicon-48.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16.png" />

<!-- iOS home screen -->
<link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />

<!-- Web manifest (Android home screen, PWA) -->
<link rel="manifest" href="/favicons/site.webmanifest" />

<!-- Theme color (browser chrome tint) -->
<meta name="theme-color" content="#c96442" />
<meta name="msapplication-TileColor" content="#16140f" />

<!-- Open Graph -->
<meta property="og:title" content="Oliver Njeru — Founding Engineer · Founder · Researcher" />
<meta property="og:description" content="Writing from Nairobi. Replicant Trader · Black Eternum Capital · multi-agent RL research." />
<meta property="og:image" content="/favicons/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://oliver.njeru.co" />
<meta property="og:type" content="website" />

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="/favicons/og-image.png" />
